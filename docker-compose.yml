version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: nutrition_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nutrition_network

volumes:
  postgres_data:

networks:
  nutrition_network:
    driver: bridge